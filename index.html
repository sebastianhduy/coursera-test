/* MÉXICO A MANO | FINAL. Diseño utilitario sin tarjetas redondeadas. */
:root {
  --green:#006847; --green-dark:#00543a; --red:#ce1126;
  --ink:#182420; --muted:#57655d; --line:#d0d8d2;
  --paper:#ffffff; --bg:#f2f3ef; --pale:#ebf3ee; --sand:#f6f1e6;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block;flex:none}img{max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{max-width:800px;margin:0 auto;padding:0 12px 85px}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper);border-bottom:1px solid #cbd6cc;margin:0 -12px;padding:11px 13px 10px;position:relative}
.masthead::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:3px;background:linear-gradient(to right,var(--green) 0 33.33%,#fff 33.33% 66.66%,var(--red) 66.66% 100%)}
.brand{text-decoration:none;display:flex;gap:9px;align-items:center;min-width:0;color:var(--ink)}
.brandmark{display:grid;place-items:center;background:var(--green);color:#fff;width:30px;height:30px}
.brand>span:last-child{display:flex;flex-direction:column;gap:0;line-height:1.13}
.brand strong{font-size:16px;letter-spacing:-.35px;font-weight:850}
.brand span span{font-size:10px;letter-spacing:.35px;color:var(--muted);font-weight:750;margin-top:3px}
.icon-button{width:38px;height:38px;border:1px solid var(--line);background:#fff;color:var(--green);display:grid;place-items:center}
.icon-button.spin svg{animation:rotate .9s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}
.preview-banner{font-size:12px;line-height:1.45;border-left:3px solid var(--red);background:var(--sand);padding:9px 11px;margin:14px 0 10px}
.topline{margin:16px 0 2px;color:var(--green);letter-spacing:.7px;text-transform:uppercase;font-size:10px;font-weight:850}
.headline{font-size:23px;line-height:1.15;margin:2px 0 3px;letter-spacing:-.55px;font-weight:850}
.subtitle{font-size:12px;color:var(--muted);margin:0 0 9px;line-height:1.4}
.date-rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:8px -12px 12px;padding:0 12px 3px}
.date-rail::-webkit-scrollbar{display:none}
.date{flex:0 0 49px;height:57px;background:#fff;border:1px solid var(--line);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.date .dow{font-size:9px;line-height:1.1;font-weight:800;text-transform:uppercase;color:var(--muted)}
.date .num{font-size:20px;line-height:1.03;font-weight:850;font-variant-numeric:tabular-nums}
.date.selected{border-color:var(--green);background:var(--green);color:#fff}.date.selected .dow{color:#e6f5eb}
.date-month{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin:1px 0 7px}
.sectionrow,.group-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 7px}
.sectionrow h2,.group-title h3{margin:0;font-size:15px;line-height:1.2;font-weight:850}
.counter{font-size:10px;font-weight:800;letter-spacing:.15px;background:#e4e9e4;color:#405349;padding:3px 6px;white-space:nowrap}
.notice{margin:10px 0;padding:10px 12px;background:var(--sand);border-left:3px solid var(--red);font-size:12px;line-height:1.5}
.notice a{text-decoration:underline;font-weight:850;color:var(--green)}
.timeline{border-top:1px solid var(--line)}
.event{display:grid;grid-template-columns:45px minmax(0,1fr);gap:5px;padding:7px 0;border-bottom:1px solid var(--line);margin:0}
.time{padding-top:10px;font-weight:850;font-size:12px;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.event-card,.result-card{background:var(--paper);border:1px solid var(--line);box-shadow:none;overflow:hidden;min-width:0}
.event-card{border-left:3px solid var(--green)}
.result-card{margin:0 0 7px;border-left:3px solid var(--red)}
.event-main{display:block;text-decoration:none;padding:10px 11px 9px;color:var(--ink)}
.event-main:active{background:var(--pale)}
.eyebrow{font-size:9px;font-weight:850;text-transform:uppercase;color:var(--muted);letter-spacing:.3px;line-height:1.5}
.event-title{font-size:15px;font-weight:850;letter-spacing:-.2px;line-height:1.25;margin:4px 0}
.event-desc{font-size:12px;color:var(--muted);line-height:1.38;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;margin:0}
.event-footer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.action-link{display:flex;align-items:center;justify-content:center;gap:5px;min-height:43px;text-align:center;padding:6px 3px;color:var(--green);text-decoration:none;font-size:11px;font-weight:800;white-space:nowrap}
.action-link+a{border-left:1px solid var(--line)}.action-link svg{width:14px;height:14px}
.action-link:active,.cta:active{background:var(--pale)}
.label-pill{display:inline-block;background:#e7f0e9;color:var(--green-dark);font-size:10px;line-height:1.35;padding:2px 5px;font-weight:800}
.label-pill.warn{background:#f9eceb;color:#9b2732}.label-pill.bad{background:#ececec;color:#656565}
.event-main .label-pill{margin-top:7px}
.group-title{margin-top:20px;border-bottom:2px solid var(--green);padding-bottom:6px}
.row-grid{display:grid;gap:0}.empty{padding:22px 13px;border:1px dashed #aebcb0;background:#fff;text-align:center;color:var(--muted);font-size:13px}
.searchfield{margin:12px 0 9px;padding:0 10px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line)}
.searchfield:focus-within{border-color:var(--green)}
.searchfield input{width:100%;height:45px;min-width:0;outline:0;border:0;color:var(--ink);background:transparent;font-size:14px}
.filters{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}.filter{padding:8px 10px;min-height:39px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;white-space:nowrap}
.filter.active{background:var(--green);border-color:var(--green);color:#fff}
.results-summary{font-size:11px;font-weight:750;color:var(--muted);margin:0 0 8px}
.result-card .event-desc{-webkit-line-clamp:2}
.back{display:inline-flex;align-items:center;gap:5px;padding:13px 0 11px;color:var(--green);text-decoration:none;font-weight:800;font-size:12px}
.detail-hero{background:#fff;border:1px solid var(--line);border-top:4px solid var(--green);padding:15px 13px 13px}
.detail-hero h1{margin:8px 0;font-size:24px;line-height:1.17;letter-spacing:-.5px;font-weight:850}
.meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);font-weight:650;margin-bottom:9px}
.location-line{font-size:12px;color:#425147;display:flex;align-items:flex-start;gap:7px;line-height:1.4}
.cta-area{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:12px 0 0}
.cta{min-height:45px;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 7px;font-size:12px;font-weight:850;text-decoration:none;border:1px solid var(--green);background:#fff;color:var(--green);text-align:center}
.cta.primary{color:#fff;background:var(--green)}.cta.secondary{background:#f0f5f0}.cta.full{grid-column:span 2}
.cta svg{width:16px;height:16px}
.reading{background:#fff;border:1px solid var(--line);border-top:none;margin-top:9px}
.reading-section{padding:13px 12px 12px;border-top:1px solid var(--line)}
.reading-section:first-child{border-top:0}
.reading-section h2{font-size:11px;text-transform:uppercase;color:var(--green-dark);letter-spacing:.4px;margin:0 0 6px;font-weight:850}
.reading-section p{font-size:13px;color:var(--ink);line-height:1.55;margin:0;white-space:pre-line}
.reading-section.highlight{background:#f0f6f1;border-left:3px solid var(--green)}
.reading-section.caution{border-left:3px solid var(--red)}.reading-section.caution h2{color:#a32c35}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);background:var(--line);gap:1px;margin-top:9px}
.fact{background:#fff;padding:10px 12px;min-height:65px}
.fact strong{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:850;letter-spacing:.2px;margin-bottom:5px}
.fact span{font-size:12px;line-height:1.45;display:block;font-weight:700}
.decision{margin-top:9px;background:#fff;border:1px solid var(--line);padding:12px}
.decision label{display:block;font-size:12px;font-weight:850;margin-bottom:7px}
.decision select{width:100%;min-height:45px;background:#fff;color:var(--ink);border:1px solid #aebfb1;padding:8px 10px;font-weight:750}
.decision p{font-size:11px;color:var(--muted);line-height:1.4;margin:7px 0 0}
.infoitem{margin:0 0 8px;padding:13px 12px;background:#fff;border:1px solid var(--line)}
.infoitem h3{font-size:14px;font-weight:850;margin:0 0 7px}.infoitem p{color:#49564d;font-size:12px;line-height:1.5;margin:0 0 10px}
.mapcard{padding:10px;background:var(--sand);border-left:3px solid var(--red);display:flex;gap:8px;justify-content:space-between;margin-top:8px}
.mapcard p{margin:0;font-size:11px}.mapcard a{font-size:12px;color:var(--green);font-weight:800}
.quiet-link{font-size:12px;color:var(--green);font-weight:800;text-decoration:underline}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;max-width:800px;margin:auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 max(4px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
.navlink{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;color:#536458;text-decoration:none;min-height:57px;font-size:10px;font-weight:800;border-top:3px solid transparent;padding-bottom:2px}
.navlink.active{border-top-color:var(--green);background:#edf4ee;color:var(--green-dark)}
.navlink svg{width:20px;height:20px}
.toast{position:fixed;z-index:70;bottom:75px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;background:#243729;color:#fff;padding:10px 12px;border-left:4px solid var(--red);width:max-content;max-width:92%;font-size:12px;line-height:1.4;text-align:center}
.toast.visible{transform:translate(-50%,0);opacity:1}
.loading{padding:70px 16px;text-align:center;font-size:13px;color:var(--muted)}.spinner{display:inline-block;width:22px;height:22px;border:3px solid #dbe3dc;border-top-color:var(--green);animation:rotate 1s linear infinite;margin-bottom:10px}
.no-background{border:0;text-decoration:underline;color:var(--green);background:transparent;font-weight:800;padding:8px}
@media(min-width:750px){.app{padding-left:18px;padding-right:18px}.masthead{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}.date-rail{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}.headline{font-size:27px}.event-title{font-size:16px}.reading-section p{font-size:14px}}
@media(max-width:345px){.app{padding-left:8px;padding-right:8px}.masthead{margin:0 -8px}.date-rail{margin:8px -8px 12px;padding:0 8px 3px}.event{grid-template-columns:39px minmax(0,1fr);gap:3px}.event-main{padding:9px 8px}.action-link{font-size:10px;gap:2px}.detail-hero h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* v5 – encabezados de fecha navegables y fichas editoriales */
.dates-row{display:grid;grid-template-columns:43px minmax(0,1fr) 43px;align-items:stretch;gap:0;margin:7px -12px 13px;background:#fff;border:1px solid var(--line)}
.date-rail{min-width:0;margin:0!important;padding:5px 0 7px!important;scrollbar-width:none}
.date-arrow{display:flex;align-items:center;justify-content:center;color:var(--green);background:#f0f5f0;text-decoration:none;font-size:30px;font-weight:650;border-right:1px solid var(--line);min-height:78px;line-height:1}
.date-arrow:last-child{border-right:0;border-left:1px solid var(--line)}
.date-arrow.disabled{color:#bac4bd;background:#f8f9f7}
.encyclopedia{background:#fff;border:1px solid var(--line);padding:16px 14px 12px;margin:0 0 16px}
.encyclopedia h2{font-size:16px;margin:0 0 12px;color:var(--green);text-transform:none}
.encyclopedia p{font-size:15px;line-height:1.6;margin:0 0 15px;text-align:left}
.encyclopedia p:last-child{margin-bottom:0}
.activity-photo{margin:12px 0 16px;background:#eff2ee;border:1px solid var(--line)}
.activity-photo img{display:block;width:100%;max-height:420px;object-fit:cover;object-position:center}
.activity-photo figcaption{padding:7px 11px;font-size:11px;color:var(--muted);background:#fff;border-top:1px solid var(--line)}
.activity-photo figcaption a{color:var(--green)}
.photo-loading,.photo-fallback{padding:30px 16px;font-size:13px;color:var(--muted);text-align:center;min-height:125px}
.fx-caption{font-size:11px;color:var(--muted);margin:0 0 15px;line-height:1.4}
@media(max-width:345px){.dates-row{grid-template-columns:36px minmax(0,1fr) 36px;margin-left:-8px;margin-right:-8px}.date-arrow{font-size:27px}}

/* Galerías fijas seleccionadas para la guía: sin búsqueda automática en tiempo real */
.activity-photo.gallery{margin:12px 0 16px;background:#fff;border:1px solid var(--line);padding:0}
.gallery-hero{position:relative;background:#e6ebe7;height:245px;overflow:hidden}
.gallery-hero img{height:100%;width:100%;max-height:none;object-fit:contain;background:#e8ece8;cursor:zoom-in}
.gallery-toolbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:7px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:12px;font-weight:750}
.gallery-toolbar button,.gallery-thumb{border:1px solid #afc1b5;background:#fff;color:#006847;min-height:34px;padding:5px 10px;font-weight:800;border-radius:0}
.gallery-toolbar button{background:rgba(255,255,255,.95)}
.gallery-thumbs{display:flex;gap:5px;padding:7px;overflow-x:auto;scroll-snap-type:x mandatory;background:#fff;scrollbar-width:thin}
.gallery-thumb{padding:0;width:74px;height:56px;min-width:74px;border:2px solid transparent;flex-shrink:0;scroll-snap-align:start}
.gallery-thumb.active{border-color:#006847}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;max-height:none;display:block}
.gallery-caption{font-size:11px;color:var(--muted);padding:7px 10px;line-height:1.45;display:flex;justify-content:space-between;gap:9px}
.gallery-caption a{color:#006847;font-weight:800;white-space:nowrap}
.photo-hint{color:#546359;font-size:11px;line-height:1.5;padding:9px 10px;background:#f2f5f2}
#photo-lightbox{border:0;border-radius:0;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;margin:0;padding:0;background:#0b1710;color:#fff}
#photo-lightbox::backdrop{background:#000}
#photo-lightbox .lb-top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #293a30;font-size:12px}
#photo-lightbox .lb-top button,#photo-lightbox .lb-actions button{background:#19291e;color:#fff;border:1px solid #637668;border-radius:0;padding:8px 14px;min-height:38px}
#photo-lightbox .lb-image{display:block;width:100%;height:calc(100dvh - 160px);object-fit:contain;max-height:none}
#photo-lightbox .lb-actions{display:flex;gap:8px;align-items:center;justify-content:center;padding:9px}
#photo-lightbox .lb-foot{text-align:center;font-size:11px;padding:5px}
#photo-lightbox .lb-foot a{color:#fff}
@media(min-width:700px){.gallery-hero{height:385px}.gallery-thumb{width:108px;height:78px;min-width:108px}}
</style>
</head>

      html+=mediaArea(a);

      html+=`<div class="facts">${a.duration?`<div class="fact"><strong>Duración</strong><span>${esc(a.duration)}</span></div>`:''}${a.category?`<div class="fact"><strong>Tipo</strong><span>${esc(a.category)}</span></div>`:''}${a.price?`<div class="fact"><strong>Precio</strong><span>${esc(inUruguayanPesos(a.price))}</span></div>`:''}${a.status?`<div class="fact"><strong>Situación</strong><span>${esc(displayStatus(a.status))}</span></div>`:''}</div>`;
      html+=`<p class="fx-caption">Importes expresados en pesos uruguayos ($U), aproximados al tipo de cambio del 7/11/2026. Confirmar tarifa antes de reservar.</p>`;
      html+=`<div class="reading">${detailText('Cómo ir y combinar con otras visitas',a.transport)}${detailText('Horarios y disponibilidad',a.availability)}${detailText('Entradas y reservas',a.booking)}${detailText('Datos útiles antes de ir',practicalNote(a.cautions),'caution')}</div>`;
      if(!a.url)html+=`<div class="mapcard"><p>Este registro todavía no tiene un enlace oficial en la planilla.</p>${external(gsearch(a.title+' '+a.address+' México'),'Buscar', 'quiet-link')}</div>`;
      html+=`<div class="decision"><label for="decision">¿En qué estado está para vos?</label><select id="decision" data-row="${a.row}" aria-label="Tu decisión sobre ${esc(a.title)}">${['Sin decidir','Me interesa','Descartar','Reservada'].map(v=>`<option value="${esc(v)}" ${a.decision===v?'selected':''}>${esc(v)}</option>`).join('')}</select><p>El cambio se guarda solo en este navegador. No se escribe en Google Sheets ni compra entradas.</p></div>`;
      html+=`<div class="cta-area" style="margin-top:14px">${approximate?external(gmap(query),ico('pin',16)+' Ver zona','cta primary'):external(gdir(query),ico('route',16)+' Cómo llegar','cta primary')}${external(gmap(query),ico('pin',16)+' Ver en Maps','cta')}</div>`;return html;
    }
    function filters(){return[['all','Todas'],['planned','Previstas'],['optional','Por decidir'],['nye','Fin de año'],['undated','Alternativas']].map(([id,label])=>`<button class="filter ${S.filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('');}
    function filtered(){const term=clean(S.search),parts=term.split(' ').filter(Boolean);return S.data.activities.filter(a=>{if(S.filter==='planned'&&isOptional(a))return false;if(S.filter==='optional'&&!isOptional(a))return false;if(S.filter==='nye'&&!isYearEve(a))return false;if(S.filter==='undated'&&a.date!=='Sin fecha')return false;const hay=clean([a.title,a.description,a.special,a.address,a.category,a.status,a.cautions].join(' '));return parts.every(p=>hay.includes(p));});}
    function searchResults(){const res=filtered();return `<p class="results-summary">${res.length} actividades</p>${res.length?res.map(a=>activityCard(a)).join(''):'<div class="empty">No hay resultados. Probá otro término o filtro.</div>'}`;}
    function explorePage(){return`<div class="topline">TU CATÁLOGO DE EXPERIENCIAS</div><h1 class="headline">Explorar</h1><p class="subtitle">Todas las fichas completas, incluidas las alternativas sin fecha.</p><label class="searchfield">${ico('search',19)}<input id="search" type="search" placeholder="Buscá museos, barrios, pirámides…" value="${esc(S.search)}" autocomplete="off" aria-label="Buscar experiencias"></label><div class="filters" id="filters">${filters()}</div><div id="results">${searchResults()}</div>`;}
    function savedPage(){const reserved=S.data.activities.filter(a=>a.decision==='Reservada'),wish=S.data.activities.filter(a=>a.decision==='Me interesa');const pending=S.data.activities.filter(a=>/reservar|confirmar|condicionada/i.test(a.status||'')&&!looksDeprioritized(a)&&a.decision==='Sin decidir').slice(0,12);
      let h=`<div class="topline">TU LISTA PERSONAL</div><h1 class="headline">Reservas y guardados</h1><p class="subtitle">Las decisiones se guardan en este navegador, no en Google Sheets.</p>`;
      h+=`<div class="group-title"><h3>Marcadas como reservadas</h3><span class="counter">${reserved.length}</span></div>`+(reserved.length?reserved.map(a=>activityCard(a)).join(''):'<div class="empty">Todavía no marcaste ninguna reserva.</div>');
      if(wish.length)h+=`<div class="group-title"><h3>Me interesa</h3><span class="counter">${wish.length}</span></div>`+wish.map(a=>activityCard(a)).join('');
      if(pending.length)h+=`<div class="group-title"><h3>Por confirmar o reservar</h3><span class="counter">${pending.length}</span></div>`+pending.map(a=>activityCard(a)).join('');return h;}
    function basePage(){const bookURL=S.data.sheetUrl||'';return `<div class="topline">INFORMACIÓN PRÁCTICA</div><h1 class="headline">Tu base en CDMX</h1><p class="subtitle">Alojamiento, fechas y accesos que necesitás durante el viaje.</p><article class="infoitem" style="margin-top:18px"><div class="eyebrow">TU APARTAMENTO</div><h3 style="font-size:20px;margin-top:8px">${esc(stay().split(',').slice(0,2).join(','))}</h3><p>${esc(stay())}</p><div class="cta-area">${external(gdir(stay()),ico('route',16)+' Cómo volver','cta primary')}${external(gmap(stay()),ico('pin',16)+' Abrir Maps','cta')}</div></article><article class="infoitem"><h3>Fechas del viaje</h3><p><b>28 de diciembre de 2026 → 13 de enero de 2027</b><br>La agenda incluye llegada, traslados y regreso al aeropuerto.</p></article><article class="infoitem"><h3>La planilla original</h3><p>Esta versión web contiene una copia de las pestañas «Calendario» y «Actividades» tomada el 7 de noviembre de 2026. No se sincroniza automáticamente.</p>${external(bookURL,ico('external',16)+' Abrir Google Sheets','cta')}</article><article class="infoitem"><h3>Conexión</h3><p>Las fichas pueden mantenerse temporalmente en este navegador si ya las consultaste. El acceso completo sin internet no está garantizado; conviene abrir la app con conexión antes de cada excursión.</p></article>`;}
    function nav(view){const items=[['dia','calendar','Días','#dia/'+(S.lastDayIso||currentTripIso())],['explorar','search','Explorar','#explorar'],['guardados','save','Guardados','#guardados'],['base','home','Mi base','#base']];$('nav').innerHTML=items.map(([id,icon,title,href])=>`<a class="navlink ${view===id||(view==='ficha'&&id==='explorar')?'active':''}" href="${href}">${ico(icon,21)}<span>${title}</span></a>`).join('');}
    function render(){if(!S.data)return;const r=route();if(r.view==='dia')S.lastDayIso=r.iso;if(r.view!=='ficha')S.lastList=location.hash||'#dia/2026-12-28';nav(r.view);let html;if(r.view==='ficha')html=detailPage(r.row);else if(r.view==='explorar')html=explorePage();else if(r.view==='guardados')html=savedPage();else if(r.view==='base')html=basePage();else html=dayPage(r.iso);$('content').innerHTML=html;if(r.view==='ficha'){const item=S.data.activities.find(a=>a.row===r.row);if(item)loadMedia(item);}document.title=(r.view==='ficha'?'Ficha · ':'')+'México a mano';if(r.view==='dia'){const selected=document.querySelector('.date.selected');if(selected)selected.scrollIntoView({block:'nearest',inline:'center',behavior:'instant'});}}
    let toastTimer;function toast(message){const el=$('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3000);}
    function applyData(data,offline=false){if(!data||!Array.isArray(data.days)||!Array.isArray(data.activities))throw Error('Los datos de Google Sheets no tienen el formato esperado.');S.data=data;S.offline=offline;S.loaded=true;if(window.__PREVIEW_TRIP__){try{const decisions=JSON.parse(retrieve('mexico-decisions-v1')||'{}');S.data.activities.forEach(a=>{if(['Sin decidir','Me interesa','Descartar','Reservada'].includes(decisions[String(a.row)]))a.decision=decisions[String(a.row)]})}catch(e){}}store(cacheKey,JSON.stringify(S.data));render();}
    function setFailure(err){$('content').innerHTML=`<div class="empty" style="margin-top:22px"><strong>No pude cargar el itinerario.</strong><p>${esc(err?.message||err||'Error de conexión')}</p><button class="no-background" id="retry">Reintentar</button></div>`;}
    function fetchData(){if(S.busy)return;S.busy=true;$('refresh').classList.add('spin');$('refresh').disabled=true;const finish=()=>{S.busy=false;$('refresh').classList.remove('spin');$('refresh').disabled=false;};
      if(window.__PREVIEW_TRIP__){finish();applyData(window.__PREVIEW_TRIP__);return;}
      if(typeof google==='undefined'||!google.script?.run){finish();const cached=retrieve(cacheKey);if(cached){try{applyData(JSON.parse(cached),true);toast('Mostrando una copia guardada en este navegador.');return}catch(e){}}setFailure('La app necesita publicarse desde Google Apps Script para leer tu Sheets privado.');return;}
      google.script.run.withSuccessHandler(data=>{finish();try{applyData(data);toast('Información actualizada desde Google Sheets.')}catch(e){setFailure(e)}}).withFailureHandler(err=>{finish();const cached=retrieve(cacheKey);if(cached){try{applyData(JSON.parse(cached),true);toast('Sin conexión: se muestra la última copia guardada.');return}catch(e){}}setFailure(err)}).getTripData();
    }
    function saveDecision(row,value,select){const a=S.data.activities.find(x=>x.row===row);if(!a)return;const before=a.decision;select.disabled=true;
      const done=()=>{a.decision=value;store(cacheKey,JSON.stringify(S.data));select.disabled=false;render();toast('Estado guardado en Google Sheets.');};
      const error=e=>{select.disabled=false;select.value=before;toast('No se pudo guardar: '+String(e?.message||'intentá de nuevo'))};
      if(window.__PREVIEW_TRIP__){a.decision=value;const d=JSON.parse(retrieve('mexico-decisions-v1')||'{}');d[String(row)]=value;store('mexico-decisions-v1',JSON.stringify(d));select.disabled=false;render();toast('Guardado en este navegador; no se sincroniza con Sheets.');return;}
      if(typeof google==='undefined'||!google.script?.run){error('La app no está publicada.');return;}
      google.script.run.withSuccessHandler(done).withFailureHandler(error).setDecision(row,a.title,value);
    }
    document.addEventListener('click',event=>{const routeLink=event.target.closest('a[href^="#"]');if(routeLink){event.preventDefault();const next=routeLink.getAttribute('href');if(location.hash===next){render();window.scrollTo({top:0,behavior:'instant'});}else location.hash=next;return;}const btn=event.target.closest('[data-filter]');if(btn){S.filter=btn.dataset.filter;$('filters').innerHTML=filters();$('results').innerHTML=searchResults();return;}if(event.target.id==='retry'){fetchData();return;}});
    document.addEventListener('input',event=>{if(event.target.id==='search'){S.search=event.target.value;$('results').innerHTML=searchResults();}});
    document.addEventListener('change',event=>{if(event.target.matches('select[data-row]'))saveDecision(Number(event.target.dataset.row),event.target.value,event.target);});
    window.addEventListener('hashchange',()=>{if(S.loaded){render();window.scrollTo({top:0,behavior:'instant'});}});
    $('refresh').addEventListener('click',fetchData);
    window.addEventListener('trip-unlocked',()=>{$('preview-notice').innerHTML='<div class="preview-banner"><b>Guía personal.</b> Copia del 7/11/2026. Los cambios se guardan en este teléfono, sin sincronización con Google Sheets.</div>';fetchData()});
    // La guía se inicia cuando se descifran los datos.
  })();
  </script>
<style>.unlock{max-width:400px;margin:44px auto;background:#fff;border-top:4px solid #006847;border-bottom:3px solid #ce1126;padding:23px 20px 26px}.unlock h1{font-size:25px;margin:0 0 7px}.unlock p{line-height:1.5;color:#415047}.unlock label{font-weight:800;display:block;margin-bottom:6px}.unlock input{height:45px;border:1px solid #86968c;width:100%;padding:8px 11px}.unlock button{height:44px;border:0;background:#006847;color:white;font-weight:800;width:100%;margin-top:12px}.unlock #error{color:#9a1623;min-height:16px;font-size:12px}.unlock .hint{font-size:12px;color:#52645a;margin-top:22px}</style>
<script>
(()=>{'use strict';
  const h=document.getElementById('content');
  const payload=JSON.parse(document.getElementById('encrypted-data').textContent);
  const cacheKey='mexico-a-mano-final-v5';
  const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice(0,(4-s.length%4)%4)),c=>c.charCodeAt(0));
  async function unlock(pass){
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.s),iterations:240000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.n)},k,b64(payload.c));
    const data=JSON.parse(new TextDecoder().decode(plain));
    if(!Array.isArray(data.days)||data.days.length!==17)throw Error('Datos incorrectos');
    window.__PREVIEW_TRIP__=data;
    localStorage.setItem(cacheKey,JSON.stringify(data));
    if(location.hash.startsWith('#unlock/'))history.replaceState(null,'',location.pathname+'#dia/2027-01-04');
    if(!location.hash)history.replaceState(null,'',location.pathname+'#dia/2027-01-04');
    window.dispatchEvent(new Event('trip-unlocked'));
  }
  function lockScreen(message=''){
    h.innerHTML='<section class="unlock"><h1>Tu guía de México</h1><p>Este itinerario está protegido. Ingresá la clave privada para abrir las 46 fichas y la agenda de 17 días.</p><form id="unlock-form"><label for="pass">Clave de acceso</label><input id="pass" type="password" autocomplete="off" required placeholder="Pegá tu clave"><button type="submit">Abrir mi guía</button><p id="error" role="alert">'+message+'</p></form><p class="hint">Los datos se descifran en tu dispositivo, no en el servidor. Las decisiones se guardan localmente.</p></section>';
    document.getElementById('unlock-form').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('pass');document.getElementById('error').textContent='Abriendo…';try{await unlock(input.value.trim())}catch(err){document.getElementById('error').textContent='Clave incorrecta o datos ilegibles.'}});
  }
  const cached=localStorage.getItem(cacheKey);
  if(cached){try{const parsed=JSON.parse(cached);if(Array.isArray(parsed.activities)&&parsed.activities.length===46){window.__PREVIEW_TRIP__=parsed;if(!location.hash)history.replaceState(null,'',location.pathname+'#dia/2027-01-04');window.dispatchEvent(new Event('trip-unlocked'));return}}catch(e){}}
  if(location.hash.startsWith('#unlock/')){let k=decodeURIComponent(location.hash.slice(8));unlock(k).catch(()=>lockScreen('No se pudo abrir con esa clave.'));return}
  lockScreen();
})();
</script>
